<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">The official API returns 3 days; this project gets your full history</title>
  <desc id="d">Two timelines. The official Clarity Data Export API covers only the last 3 days. ms-clarity-backfill covers every day Clarity still has.</desc>
  <defs>
    <linearGradient id="full" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #171717; }
    .h { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
    .s { font-size: 17px; fill: #666666; }
    .lbl { font-size: 16px; font-weight: 600; }
    .note { font-size: 14px; fill: #666666; }
    .tick { font-size: 13px; fill: #8f8f8f; }
    .badge { font-size: 13px; font-weight: 600; fill: #ffffff; }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="16" fill="#ffffff" stroke="#ebebeb"/>

  <text class="h" x="48" y="72">Clarity's API stops at 3 days. Your data doesn't.</text>
  <text class="s" x="48" y="104">Back up and query every day of Microsoft Clarity data. Dashboard, recordings list, funnels, heatmaps.</text>

  <!-- Row 1: official API -->
  <text class="lbl" x="48" y="168">Official Data Export API</text>
  <text class="note" x="48" y="190">10 requests a day, last 1–3 days only</text>
  <rect x="340" y="156" width="812" height="28" rx="14" fill="#f2f2f2"/>
  <rect x="1112" y="156" width="40" height="28" rx="14" fill="#8f8f8f"/>
  <text class="note" x="1100" y="174" text-anchor="end">last 3 days</text>

  <!-- Row 2: this project -->
  <text class="lbl" x="48" y="248">ms-clarity-backfill</text>
  <text class="note" x="48" y="270">any date range, every day Clarity still has</text>
  <rect x="340" y="236" width="812" height="28" rx="14" fill="url(#full)"/>
  <text class="badge" x="360" y="255">your full history</text>

  <!-- axis -->
  <line x1="340" y1="300" x2="1152" y2="300" stroke="#ebebeb"/>
  <line x1="340" y1="294" x2="340" y2="306" stroke="#d4d4d4"/>
  <line x1="1152" y1="294" x2="1152" y2="306" stroke="#d4d4d4"/>
  <text class="tick" x="340" y="326">first day of data</text>
  <text class="tick" x="1152" y="326" text-anchor="end">today</text>
  <text class="tick" x="746" y="326" text-anchor="middle">Chrome extension (no extra requests) · MCP server for Claude</text>
</svg>
