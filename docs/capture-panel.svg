<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">The Capture panel on clarity.microsoft.com (illustration, example data)</title>
  <desc id="d">A floating panel in the bottom-right of the Clarity page. It has a date range selector (3D to 1Y, or Last N days), a summary of what is captured for the current range with a checklist for Dashboard, Recordings and Heatmaps, Copy JSON and Download JSON buttons, and a diagnostics line.</desc>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #171717; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .muted { fill: #8f8f8f; }
    .sec { fill: #4d4d4d; }
    .callout { font-size: 15px; fill: #171717; }
    .callnum { font-size: 13px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="719" rx="16" fill="#f5f5f5" stroke="#ebebeb"/>

  <!-- faded Clarity page behind -->
  <rect x="24" y="24" width="700" height="672" rx="10" fill="#ffffff" stroke="#ebebeb"/>
  <rect x="24" y="24" width="700" height="48" rx="10" fill="#fafafa"/>
  <text x="48" y="54" style="font-size:14px;font-weight:600" class="muted">clarity.microsoft.com / example.com / Dashboard</text>
  <g opacity="0.35">
    <rect x="48" y="96" width="150" height="70" rx="8" fill="#ededed"/>
    <rect x="212" y="96" width="150" height="70" rx="8" fill="#ededed"/>
    <rect x="376" y="96" width="150" height="70" rx="8" fill="#ededed"/>
    <rect x="48" y="184" width="320" height="200" rx="8" fill="#ededed"/>
    <rect x="384" y="184" width="142" height="200" rx="8" fill="#ededed"/>
    <rect x="48" y="400" width="478" height="120" rx="8" fill="#ededed"/>
  </g>

  <!-- panel -->
  <g filter="url(#sh)">
    <rect x="320" y="56" width="380" height="580" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
  </g>
  <text x="340" y="86" style="font-size:15px;font-weight:600">Clarity Capture</text>
  <text x="340" y="106" style="font-size:12px" class="muted">example.com · dashboard</text>
  <path d="M672 78 l10 10 M682 78 l-10 10" stroke="#8f8f8f" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="320" y1="122" x2="700" y2="122" stroke="#ebebeb"/>

  <text x="340" y="148" style="font-size:12px;font-weight:500" class="muted">Date range</text>
  <rect x="340" y="158" width="340" height="34" rx="8" fill="#fafafa" stroke="#ebebeb"/>
  <g style="font-size:12px;font-weight:500" text-anchor="middle">
    <text x="368" y="180" class="sec">3D</text>
    <text x="424" y="180" class="sec">7D</text>
    <text x="481" y="180" class="sec">30D</text>
    <rect x="512" y="161" width="54" height="28" rx="6" fill="#ffffff" stroke="#d4d4d4"/>
    <text x="539" y="180">90D</text>
    <text x="595" y="180" class="sec">180D</text>
    <text x="652" y="180" class="sec">1Y</text>
  </g>
  <rect x="340" y="202" width="268" height="32" rx="6" fill="#ffffff" stroke="#d4d4d4"/>
  <text x="352" y="223" style="font-size:12px" class="muted">Last</text>
  <text x="384" y="223" style="font-size:13px" class="mono muted">300</text>
  <text x="566" y="223" style="font-size:12px" class="muted">days</text>
  <rect x="616" y="202" width="64" height="32" rx="6" fill="#ffffff" stroke="#d4d4d4"/>
  <text x="648" y="223" style="font-size:13px;font-weight:500" text-anchor="middle">Apply</text>
  <text x="340" y="254" style="font-size:11.5px" class="muted">Reloads the page with this range so everything gets saved.</text>
  <line x1="320" y1="270" x2="700" y2="270" stroke="#ebebeb"/>

  <text x="340" y="296" style="font-size:12px;font-weight:500" class="muted">This range</text>
  <text x="340" y="318" style="font-size:15px;font-weight:600">Aug 28 – Nov 25, 2026</text>
  <text x="340" y="336" style="font-size:12px" class="muted">90 days · 21 data types</text>
  <rect x="340" y="348" width="340" height="56" rx="8" fill="#ffffff" stroke="#ebebeb"/>
  <line x1="453" y1="348" x2="453" y2="404" stroke="#ebebeb"/>
  <line x1="566" y1="348" x2="566" y2="404" stroke="#ebebeb"/>
  <text x="352" y="368" style="font-size:11px" class="muted">Sessions</text>
  <text x="352" y="392" style="font-size:17px;font-weight:600" class="mono">12,480</text>
  <text x="465" y="368" style="font-size:11px" class="muted">Users</text>
  <text x="465" y="392" style="font-size:17px;font-weight:600" class="mono">9,031</text>
  <text x="578" y="368" style="font-size:11px" class="muted">Recordings</text>
  <text x="578" y="392" style="font-size:17px;font-weight:600" class="mono">300</text>

  <!-- checklist -->
  <g>
    <rect x="340" y="414" width="340" height="32" rx="8" fill="#ffffff" stroke="#d4d4d4"/>
    <circle cx="358" cy="430" r="8" fill="#1a9b4b"/><path d="M354 430 l3 3 l5 -6" stroke="#fff" stroke-width="1.8" fill="none"/>
    <text x="374" y="435" style="font-size:13px;font-weight:500">Dashboard</text>
    <text x="668" y="435" style="font-size:12px" class="muted" text-anchor="end">Captured</text>
  </g>
  <g>
    <rect x="340" y="452" width="340" height="32" rx="8" fill="#ffffff" stroke="#ebebeb"/>
    <circle cx="358" cy="468" r="8" fill="#1a9b4b"/><path d="M354 468 l3 3 l5 -6" stroke="#fff" stroke-width="1.8" fill="none"/>
    <text x="374" y="473" style="font-size:13px;font-weight:500">Recordings</text>
    <text x="668" y="473" style="font-size:12px" class="muted mono" text-anchor="end">300 of 12,480</text>
  </g>
  <g>
    <rect x="340" y="490" width="340" height="32" rx="8" fill="#ffffff" stroke="#ebebeb"/>
    <circle cx="358" cy="506" r="7" fill="none" stroke="#d4d4d4" stroke-width="1.5"/>
    <text x="374" y="511" style="font-size:13px;font-weight:500">Heatmaps</text>
    <text x="668" y="511" style="font-size:12px" class="muted" text-anchor="end">Open to capture</text>
  </g>
  <line x1="320" y1="536" x2="700" y2="536" stroke="#ebebeb"/>

  <rect x="340" y="550" width="164" height="32" rx="6" fill="#ffffff" stroke="#d4d4d4"/>
  <text x="422" y="571" style="font-size:13px;font-weight:500" text-anchor="middle">Copy JSON</text>
  <rect x="516" y="550" width="164" height="32" rx="6" fill="#171717"/>
  <text x="598" y="571" style="font-size:13px;font-weight:500;fill:#ffffff" text-anchor="middle">Download JSON</text>
  <path d="M320 600 h380 v24 a12 12 0 0 1 -12 12 h-356 a12 12 0 0 1 -12 -12 z" fill="#fafafa"/>
  <line x1="320" y1="600" x2="700" y2="600" stroke="#ebebeb"/>
  <text x="340" y="622" style="font-size:11px" class="muted mono">API calls 42 · intercepted 42 · saved 38</text>

  <!-- launcher -->
  <rect x="588" y="650" width="112" height="34" rx="17" fill="#171717"/>
  <circle cx="606" cy="667" r="4" fill="#3ecf8e"/>
  <text x="618" y="672" style="font-size:13px;font-weight:500;fill:#ffffff">Capture</text>
  <text x="676" y="672" style="font-size:12px;fill:#bdbdbd" class="mono">6</text>

  <!-- callouts -->
  <g>
    <line x1="700" y1="175" x2="770" y2="175" stroke="#006bff" stroke-width="1.5"/>
    <circle cx="784" cy="175" r="12" fill="#006bff"/><text class="callnum" x="784" y="180" text-anchor="middle">1</text>
    <text class="callout" x="806" y="170" style="font-weight:600">Pick any range</text>
    <text class="callout sec" x="806" y="190" style="font-size:14px">3 days to a year, or "Last N days".</text>
  </g>
  <g>
    <line x1="700" y1="468" x2="770" y2="468" stroke="#006bff" stroke-width="1.5"/>
    <circle cx="784" cy="468" r="12" fill="#006bff"/><text class="callnum" x="784" y="473" text-anchor="middle">2</text>
    <text class="callout" x="806" y="455" style="font-weight:600">Open each page you want</text>
    <text class="callout sec" x="806" y="475" style="font-size:14px">Ticks turn green once its data is saved.</text>
    <text class="callout sec" x="806" y="495" style="font-size:14px">Click a row to open it with the same range.</text>
  </g>
  <g>
    <line x1="700" y1="566" x2="770" y2="566" stroke="#006bff" stroke-width="1.5"/>
    <circle cx="784" cy="566" r="12" fill="#006bff"/><text class="callnum" x="784" y="571" text-anchor="middle">3</text>
    <text class="callout" x="806" y="561" style="font-weight:600">Copy or download clean JSON</text>
    <text class="callout sec" x="806" y="581" style="font-size:14px">Saved to Downloads/clarity-exports/</text>
  </g>
  <g>
    <line x1="700" y1="618" x2="770" y2="640" stroke="#006bff" stroke-width="1.5"/>
    <circle cx="784" cy="644" r="12" fill="#006bff"/><text class="callnum" x="784" y="649" text-anchor="middle">4</text>
    <text class="callout" x="806" y="639" style="font-weight:600">Check nothing was missed</text>
    <text class="callout sec" x="806" y="659" style="font-size:14px">"missed" appears here if a request slipped past.</text>
  </g>
  <text x="1176" y="704" style="font-size:12px" class="muted" text-anchor="end">Illustration with example data</text>
</svg>
